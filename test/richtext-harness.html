<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Rich text harness</title>
</head>
<body>
<!-- content/richtext.js has no dependencies, so it can be loaded as a plain
     page script here. A content script's globals live in an isolated world the
     test cannot reach; this puts the same file in the page's own world, where
     page.evaluate can call it directly. Never shipped: tools/pack.mjs does not
     include test/. -->
<script src="/content/richtext.js"></script>
</body>
