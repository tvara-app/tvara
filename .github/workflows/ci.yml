name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The gitleaks step below scans a commit RANGE, which needs history;
          # the default shallow clone has none.
          fetch-depth: 0

      # 24 is the Active LTS line (Krypton). The v5 actions above matter as
      # much as the number: v4 ran on the Node 20 runtime, which GitHub
      # deprecated and now force-runs on 24 while printing a warning on every
      # single run. v5 targets 24 natively, so the warning goes away instead of
      # being tolerated.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Unblocked by Phase 1's repo-root fix — this now runs from any clone path.
      # Now includes the full Layer 3 security suite (moved here from
      # nightly-only after a cross-session review found the ship gate
      # — npm test && pack && preflight — could regress a fixed
      # vulnerability, get a green run, and ship, with the only thing that
      # would have caught it running hours later against an already-shipped
      # tree. A check that exists but isn't in the path that matters isn't
      # a check.
      - run: npm test

      - run: npm run lint

      # web-ext is FIREFOX's linter, so it is pointed at the Firefox build
      # rather than at the source tree. Run against the source it read the
      # Chrome manifest and failed on `background.service_worker`, which
      # Firefox does not support and which is correct for the artifact we
      # actually ship to Chrome — an error that could only ever be resolved by
      # breaking the Chrome build. The script now packs the Firefox zip and
      # lints that, where its rules genuinely apply.
      - run: npm run lint:webext

      # ~50-100 row PR-gate smoke slice: one row per (surface × lifecycle) at
      # state in {free, pro}, host=synthetic. Seconds, not the full 20,650.
      - run: node test/test-matrix.mjs --smoke

      # New-commits-only, not full history — Item 0's own purge is a separate,
      # human-approved action, not something this gate re-litigates every PR.
      #
      # Runs the gitleaks CLI rather than gitleaks/gitleaks-action@v2. The
      # action refuses to start on an ORGANIZATION-owned repository without a
      # paid licence key ("[tvara-app] is an organization. License key is
      # required."), so as configured it could never pass and was reporting a
      # licensing wall as a failed security scan. The scanner itself is MIT and
      # free; only the Action wrapper is gated.
      - name: Gitleaks (new commits only)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A new branch, or a first push, reports an all-zero "before".
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          echo "scanning ${BASE}..HEAD"
          /tmp/gitleaks git . --log-opts="${BASE}..HEAD" --redact --no-banner

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript p/xss

  # Tarnish (mandatoryprogrammer/tarnish) is recommended for manifest/CSP
  # auditing of the packed build but isn't wired into CI here — its CLI
  # invocation wasn't verified against this exact repo layout during this
  # pass. Run it manually against dist/*.zip periodically until that's done.
