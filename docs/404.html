<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex" />
<title>Not found · Tvara</title>
<style>
  :root { --bg:#0e1117; --panel:#161b26; --text:#e8eaf0; --muted:#a8b1c2; --accent:#7aa2ff; --line:rgba(255,255,255,.12); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:860px; margin:auto; padding:0 24px; }
  header { padding:64px 0 44px; text-align:center; }
  h1 { font-size:40px; line-height:1.2; margin:0 0 14px; }
  h2 { font-size:26px; margin:0 0 18px; }
  h3 { font-size:18px; margin:24px 0 8px; }
  section { border-top:1px solid var(--line); padding:42px 0; }
  p, li { color:var(--muted); }
  strong { color:var(--text); }
  a { color:var(--accent); }
  .sub { max-width:680px; margin:0 auto; color:var(--muted); font-size:18px; }
  .badge { display:inline-block; margin-top:20px; padding:6px 14px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  .card { padding:20px; background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .card b { display:block; margin-bottom:6px; }
  .price { padding:24px; max-width:410px; background:var(--panel); border:1px solid var(--accent); border-radius:12px; }
  .amount { color:var(--text); font-size:34px; font-weight:800; }
  .brand { display:inline-flex; align-items:center; gap:10px; color:var(--text); font-size:17px; font-weight:700; text-decoration:none; }
  .brand img { width:32px; height:32px; border-radius:9px; }
  nav { margin-top:20px; font-size:14px; }
  footer { padding:36px 0 52px; border-top:1px solid var(--line); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/icons/icon128.png" alt="" width="64" height="64" />
    <h1>Page not found</h1>
    <p>That address is not part of this site.</p>
    <p><a href="/">Go to the Tvara home page</a></p>
  </header>
</div>
</body>
</html>
